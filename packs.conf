# packs.conf — qué ZIM de Kiwix descargar. Editable.
#
# Formato: carpeta/prefijo   # tamaño aprox, descripción
# La carpeta y el prefijo son los reales de https://download.kiwix.org/zim/<carpeta>/
# (verificados el 2026-09-05). El script resuelve solo la fecha más reciente.
# Las líneas que empiezan con # están desactivadas.
#
# Presupuesto: disco de 1 TB en /srv/respaldo (~885 GB utilizables). Lo activo suma
# ~595 GB de ZIM; con manuales, mapas, software y el modelo de lenguaje quedan
# ~265 GB libres. Ese margen hace falta: al actualizar, cada ZIM nuevo se descarga
# entero antes de borrar el viejo, y el mayor (Khan Academy) pesa 168 GB.
# La fase 0 aborta si no cabe y dice qué comentar.

# --- Enciclopedias ---
wikipedia/wikipedia_en_all_maxi          # 115 GB  Wikipedia inglés completa con imágenes
wikipedia/wikipedia_es_all_maxi          #  38 GB  Wikipedia español completa con imágenes
wikipedia/wikipedia_en_medicine_maxi     # 2.1 GB  Subconjunto médico (para copiar a celulares)

