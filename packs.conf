# ============ EXTRAS opcionales (--extra <nombre>) ============
# --extra literatura: la literatura de Gutenberg sin los 206 GB del resto. Kiwix publica el
# Gutenberg inglés dividido por clasificación de la Biblioteca del Congreso (LCC); las clases P*
# son lengua y literatura: 57 GB con las mismas obras literarias. Los libros en español están en
# gutenberg_es_all (892 títulos, ya en full) y en la Biblioteca de Autores Españoles (55 tomos).
# Ver docs/CANON_LITERARIO.md.
extra:literatura P3 cultura gutenberg/gutenberg_en_lcc-pr   #  15 GB  Literatura inglesa (Shakespeare, Austen, Dickens, Brontë, Milton, Chaucer)
extra:literatura P3 cultura gutenberg/gutenberg_en_lcc-ps   #  15 GB  Literatura estadounidense (Melville, Twain, Poe, Whitman, James)
extra:literatura P3 cultura gutenberg/gutenberg_en_lcc-pz   #  18 GB  Ficción y literatura juvenil en inglés
extra:literatura P3 cultura gutenberg/gutenberg_en_lcc-pq   # 3.8 GB  Literaturas romances traducidas (Cervantes, Dante, Molière, Zola)
extra:literatura P3 cultura gutenberg/gutenberg_en_lcc-pn   # 3.0 GB  Literatura general, teatro, crítica
extra:literatura P3 cultura gutenberg/gutenberg_en_lcc-pt   # 724 MB  Literatura germánica (Goethe, Ibsen, Andersen)
extra:literatura P3 cultura gutenberg/gutenberg_en_lcc-pa   # 498 MB  Griega y latina clásica (Homero, Virgilio, Platón, Ovidio)
extra:literatura P3 cultura gutenberg/gutenberg_en_lcc-pg   # 261 MB  Literatura eslava (Tolstói, Dostoievski, Chéjov)

