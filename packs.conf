# packs.conf — qué ZIM de Kiwix descargar. Editable.
#
# Formato:  perfil prioridad categoria carpeta/prefijo   # tamaño aprox, descripción
#   perfil    survive | core | recovery | full | extra:<nombre>   (perfil mínimo que lo incluye;
#             survive ⊂ core ⊂ recovery ⊂ full; extra:X solo con --extra X; 15y = survive)
#   prioridad P0 vivir 15 años · P1 oficios · P2 legado · P3 cultura
#   categoria una palabra (medicina, agua, agricultura, enciclopedia, ciencia, ...)
# Carpeta y prefijo son los reales de https://download.kiwix.org/zim/<carpeta>/ (verificados
# 2026-09-05). El script resuelve solo la fecha más reciente. Líneas con # están desactivadas.
# Una línea sin atributos se trata como "full P2 general".
#
# Presupuesto (tamaños reales de ZIM): SURVIVE ≈ 49 GB · CORE ≈ 55 GB · RECOVERY ≈ 220 GB ·
# FULL ≈ 450 GB. La fase 0 comprueba el espacio con 15 % de margen y dice qué comentar si no cabe.

