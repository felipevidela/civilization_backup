# software.conf — software de rescate (fase 6) y mapas (fase 5). Editable.
# Formato clave=valor; lo lee bash con "source". 1 = activo, 0 = desactivado.

# Perfil mínimo de cada bloque de software (core ⊂ recovery ⊂ full). Ver lib/profiles.sh.
SOFT_PERFILES="deb:core kiwix:core organicmaps:core mapas:core iso:recovery llm:core llm7b:recovery ia:recovery repo:core source:recovery"

# Paquetes .deb (con dependencias) que se guardan en software/deb/ para instalar sin internet.
DEB_PAQUETES="kiwix-tools zim-tools aria2 calibre keepassxc gocryptfs rsync jq curl wget python3-pip python3-venv python3-numpy tmux par2 poppler-utils sqlite3"

# Kiwix Desktop (AppImage x86_64) desde https://download.kiwix.org/release/kiwix-desktop/
KIWIX_DESKTOP=1
# kiwix-tools binario estático (kiwix-serve sin apt) desde https://download.kiwix.org/release/kiwix-tools/
KIWIX_TOOLS_BIN=1
# Kiwix Android (APK) desde https://github.com/kiwix/kiwix-android/releases
KIWIX_ANDROID=1
KIWIX_ANDROID_ABI="arm64-v8a"       # arm64-v8a | armeabi-v7a | universal
# Organic Maps (APK) desde https://github.com/organicmaps/organicmaps/releases
ORGANICMAPS_APK=1

# Mapas .mwm de Organic Maps (fase 5). Se descargan todas las regiones cuyo id
# empieza por el país (Chile_Central, Chile_North, ...). Servidor y versión se
# resuelven en https://meta.omaps.app/maps y data/countries.json del repo.
MAPAS=1
MAPAS_PAISES="Chile Argentina Peru Bolivia"

# ISO de Ubuntu 24.04 LTS (desktop amd64), verificada con SHA256SUMS oficial.
UBUNTU_ISO=1
UBUNTU_ISO_URL_BASE="https://releases.ubuntu.com/24.04"
UBUNTU_ISO_PATRON="desktop-amd64.iso"

# Modelo de lenguaje local: llama.cpp compilado para CPU + modelo GGUF desde Hugging Face.
# En un PC de 8 GB de RAM y 4 núcleos (i3) el 7B cabe pero responde lento (2-3 min con
# búsqueda); por eso se baja también un modelo "rápido" de 3B que se elige con --rapido.
LLM_ENABLED=1
LLM_MODEL_REPO="bartowski/Qwen2.5-7B-Instruct-GGUF"
LLM_MODEL_FILE="Qwen2.5-7B-Instruct-Q4_K_M.gguf"
LLM_RAPIDO_REPO="bartowski/Qwen2.5-3B-Instruct-GGUF"
LLM_RAPIDO_FILE="Qwen2.5-3B-Instruct-Q4_K_M.gguf"   # vacío = no bajar el modelo rápido
LLM_CONTEXTO=4096                                   # tokens de contexto (más = más RAM)
LLAMACPP_REPO="https://github.com/ggml-org/llama.cpp"
LLAMACPP_REF=""                      # vacío = última release publicada

# Chat con la biblioteca (software/llm/preguntar.sh): busca en Kiwix y responde con el modelo.
LLM_PREGUNTAR=1

# Cómo crear una IA desde cero (software/ia/): guía, código de referencia y librerías Python.
IA_ENABLED=1
IA_REPOS="karpathy/micrograd karpathy/minbpe karpathy/nanoGPT karpathy/llm.c rasbt/LLMs-from-scratch ggml-org/ggml"
IA_WHEELS="torch numpy tiktoken"          # ruedas CPU para x86_64 / Python 3.12 (Ubuntu 24.04)

# Copia espejo de este repositorio en software/arca.git para restaurar sin internet.
REPO_MIRROR=1

# Margen de seguridad que la fase 0 suma al espacio pendiente de descargar (en %).
MARGEN_ESPACIO_PCT=15

# Actualización de ZIM cuando el disco va lleno. Normalmente la versión nueva se descarga
# entera antes de borrar la vieja. Con 1 = si no caben las dos, se borra la vieja primero
# (ese ZIM no está disponible mientras dura la descarga; si falla, se reintenta en la
# siguiente actualización). Con 0 = se anota el error y se conserva la vieja.
ZIM_BORRAR_VIEJO_SI_NO_CABE=0
