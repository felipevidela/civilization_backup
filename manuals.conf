# manuals.conf — PDFs y recursos sueltos (fase 4). Editable.
#
# Formato:  destino_relativo | url | descripción
#   destino_relativo: ruta bajo /srv/respaldo. Si termina en "/" es una carpeta
#                     (para recursos de varios archivos); si no, es el nombre del archivo.
#   url: https://... descarga directa
#        ia://ITEM              todos los PDF originales de un ítem de archive.org
#        ia://ITEM/archivo.pdf  un archivo concreto del ítem
#        ocw://slug             ZIP completo de un curso de MIT OpenCourseWare
#        mirror://URL?max=N     espejo HTML con wget, límite N GB
#        openstax://en|es       todos los libros de texto OpenStax en PDF del idioma
#        github://usuario/repo/REGEX  asset de la última release de GitHub cuyo nombre cumpla la REGEX
#
# Un fallo no detiene el resto: queda en /srv/respaldo/.arca/failed.txt y se reintenta
# en la próxima ejecución de setup.sh o update.sh. URLs verificadas el 2026-09-05.

